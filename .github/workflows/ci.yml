name: CI
on: [push]
permissions:
  contents: read
  checks: write
jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Theme Check
        uses: shopify/theme-check-action@58fd69afdfc30110f997ba9e212b302671e00d3b # v2.2.0
        with:
          token: ${{ github.token }}
